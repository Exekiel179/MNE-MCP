[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mne-cpp-mcp"
version = "0.1.0a1"
description = "Local MCP bridge to the official MNE-CPP native command-line tools"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mcp>=1.27,<2", "pydantic>=2,<3", "tomlkit>=0.13,<1"]

[project.scripts]
mne-cpp-mcp = "mne_cpp_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mne_cpp_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "mne_cpp_mcp/_bundled/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
