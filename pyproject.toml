[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mne-mcp"
dynamic = ["version"]
description = "A Model Context Protocol server for MNE-Python neurophysiology analysis (EEG / MEG / sEEG / ECoG / fNIRS)"
readme = "README.md"
authors = [
    { name = "MNE MCP Contributors" }
]
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
# Reuse the user's scientific environment. Analysis libraries are not installed
# or upgraded by this interface package.
dependencies = [
    "mcp>=1.2.0",
    "fastmcp>=2.14.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/Exekiel179/MNE-MCP"
Repository = "https://github.com/Exekiel179/MNE-MCP"
Issues = "https://github.com/Exekiel179/MNE-MCP/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "tomli>=2.0; python_version < '3.11'",
    "pytest-cov>=4.0",
]

[project.scripts]
mne-mcp = "mne_mcp.cli:main"

[tool.hatch.version]
path = "src/mne_mcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/mne_mcp"]

[tool.hatch.build.targets.wheel.force-include]
# Ship the companion skills + subagents inside the wheel so a plain
# `pip install mne-mcp` carries them; `mne-mcp setup` installs from this copy.
"skills" = "mne_mcp/_bundled/skills"
"agents" = "mne_mcp/_bundled/agents"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
include = ["/src/mne_mcp", "/skills", "/agents", "/scripts/install.py", "/tests", "/docs/*.md", "/README*.md", "/QUICK_START.md", "/INSTALL_AGENT.md", "/TOOLS_REFERENCE*.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/LICENSE", "/pyproject.toml", "/requirements*.lock"]
